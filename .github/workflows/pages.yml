name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-wozniak-xg1vgp]
  workflow_dispatch:

# Least privilege: the workflow can read the repo and nothing else by default.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # publish to Pages
      id-token: write   # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to exact commits so a moved tag cannot inject code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Security checks
        run: |
          set -euo pipefail
          fail=0
          # Every page must carry the strict Content-Security-Policy.
          for f in $(find . -name '*.html' -not -path './.git/*'); do
            if ! grep -q 'http-equiv="Content-Security-Policy"' "$f"; then echo "::error file=$f::missing Content-Security-Policy"; fail=1; fi
            if grep -qE '<script>[^<]' "$f"; then echo "::error file=$f::inline script found (blocked by CSP)"; fail=1; fi
          done
          # No credentials or keys may ever be published.
          if grep -rIlE 'BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_|AKIA[0-9A-Z]{16}|sk_live_' --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::possible secret found"; fail=1
          fi
          exit $fail

      - name: Prepare site (same allow-listed files as Cloudflare)
        run: |
          bash scripts/cf-build.sh
          rm public/_headers   # Cloudflare-only header rules; Pages ignores them
          find public -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

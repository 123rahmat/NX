name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-wozniak-xg1vgp]
  workflow_dispatch:

# Least privilege: the workflow can read the repo and nothing else by default.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # publish to Pages
      id-token: write   # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to exact commits so a moved tag cannot inject code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Security checks
        run: |
          set -euo pipefail
          fail=0
          # Every page must carry the strict Content-Security-Policy.
          for f in $(find . -name '*.html' -not -path './.git/*'); do
            if ! grep -q 'http-equiv="Content-Security-Policy"' "$f"; then echo "::error file=$f::missing Content-Security-Policy"; fail=1; fi
            if grep -qE '<script>[^<]' "$f"; then echo "::error file=$f::inline script found (blocked by CSP)"; fail=1; fi
          done
          # No credentials or keys may ever be published.
          if grep -rIlE 'BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_|AKIA[0-9A-Z]{16}|sk_live_' --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::possible secret found"; fail=1
          fi
          exit $fail

      - name: Prepare site (public files only)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude 'README.md' --exclude 'DEPLOYMENT.md' --exclude 'wrangler.jsonc' --exclude 'worker' --exclude 'brand' --exclude '_site' --exclude '_headers' ./ _site/
          find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
